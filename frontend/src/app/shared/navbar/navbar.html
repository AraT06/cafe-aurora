<header class="navbar">
  <div class="container navbar__inner">
    <a routerLink="/" class="navbar__brand" (click)="cerrarMenu()">Café Aurora</a>

    <nav class="navbar__links" [class.is-open]="menuAbierto()">
      @for (enlace of enlaces; track enlace.ruta) {
        <a
          [routerLink]="enlace.ruta"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: enlace.ruta === '/' }"
          (click)="cerrarMenu()"
        >
          {{ enlace.texto }}
        </a>
      }
    </nav>

    <div class="navbar__iconos">
      <a routerLink="/favoritos" class="navbar__icono" aria-label="Favoritos" (click)="cerrarMenu()">
        <i class="fa-regular fa-heart"></i>
      </a>
      <a [routerLink]="authService.autenticado() ? '/cuenta' : '/login'" class="navbar__icono" aria-label="Cuenta" (click)="cerrarMenu()">
        <i class="fa-regular fa-user"></i>
      </a>
      <a routerLink="/carrito" class="navbar__icono navbar__icono--carrito" aria-label="Carrito" (click)="cerrarMenu()">
        <i class="fa-solid fa-bag-shopping"></i>
        @if (carritoService.cantidadItems() > 0) {
          <span class="navbar__badge">{{ carritoService.cantidadItems() }}</span>
        }
      </a>

      <button
        type="button"
        class="navbar__toggle"
        [class.is-open]="menuAbierto()"
        (click)="alternarMenu()"
        aria-label="Abrir menú de navegación"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
